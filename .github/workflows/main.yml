name: Build REBAZ TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android Project for REBAZ TV
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/rebaz/rebaztv
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        
        cat << 'EOF' > app/src/main/res/drawable/ic_close.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_fullscreen.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M7,14H5v5h5v-2H7V14z M5,10h2V7h3V5H5V10z M17,17h-3v2h5v-5h-2V17z M14,5v2h3v3h2V5H14z"/>
        </vector>
        EOF
        
        if [ -f "logo.png" ]; then cp logo.png app/src/main/res/drawable/ic_launcher.png
        elif [ -f "logo.jpg" ]; then cp logo.jpg app/src/main/res/drawable/ic_launcher.png
        else curl -L -o app/src/main/res/drawable/ic_launcher.png "https://upload.wikimedia.org/wikipedia/commons/c/cf/ExoPlayer_logo.png"; fi
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.rebaz.rebaztv'
            compileSdk 34
            defaultConfig {
                applicationId "com.rebaz.rebaztv"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF
        
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0A0E17">

            <FrameLayout
                android:id="@+id/player_container"
                android:layout_width="match_parent"
                android:layout_height="240dp"
                android:layout_alignParentTop="true"
                android:visibility="gone">

                <com.google.android.exoplayer2.ui.StyledPlayerView
                    android:id="@+id/main_player_view"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"
                    android:background="#000000"
                    app:surface_type="texture_view"
                    app:resize_mode="fit"
                    app:use_controller="true"
                    app:show_timeout="3000"
                    app:controller_layout_id="@layout/custom_exo_controls"/>

                <ProgressBar
                    android:id="@+id/native_loading_spinner"
                    android:layout_width="55dp"
                    android:layout_height="55dp"
                    android:layout_gravity="center"
                    android:indeterminateTint="#4da6ff"
                    android:visibility="gone" />
            </FrameLayout>

            <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                android:id="@+id/swipe_refresh"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:layout_below="@id/player_container">
                
                <WebView
                    android:id="@+id/main_web_view"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"
                    android:background="@android:color/transparent"/>
            </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

            <LinearLayout
                android:id="@+id/security_alert_layout"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#0B0B0E"
                android:orientation="vertical"
                android:gravity="center"
                android:padding="30dp"
                android:visibility="gone"
                android:clickable="true"
                android:focusable="true">
                <ImageView android:layout_width="100dp" android:layout_height="100dp" android:src="@android:drawable/ic_dialog_alert" android:layout_marginBottom="25dp" />
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SECURITY ALERT" android:textColor="#EF4444" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="12dp" />
                <Button android:id="@+id/security_exit_btn" android:layout_width="160dp" android:layout_height="50dp" android:text="EXIT" android:textColor="#FFFFFF" android:backgroundTint="#EF4444" android:textStyle="bold" />
            </LinearLayout>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/custom_exo_controls.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#30000000">
            <ImageButton android:id="@+id/custom_close_btn" android:layout_width="45dp" android:layout_height="45dp" android:layout_alignParentTop="true" android:layout_alignParentEnd="true" android:layout_marginTop="12dp" android:layout_marginEnd="12dp" android:background="@android:color/transparent" android:src="@drawable/ic_close" android:tint="#EF4444" />
            <ImageButton android:id="@+id/exo_fullscreen" android:layout_width="45dp" android:layout_height="45dp" android:layout_alignParentBottom="true" android:layout_alignParentStart="true" android:layout_marginStart="12dp" android:layout_marginBottom="12dp" android:background="@android:color/transparent" android:src="@drawable/ic_fullscreen" android:tint="#FFFFFF" />
        </RelativeLayout>
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:label="REBAZ TV" android:icon="@drawable/ic_launcher" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/rebaz/rebaztv/MainActivity.java
        package com.rebaz.rebaztv;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.content.pm.ActivityInfo;
        import android.graphics.Color;
        import android.net.Uri;
        import android.os.Bundle;
        import android.os.Handler;
        import android.view.View;
        import android.view.ViewGroup;
        import android.view.WindowManager;
        import android.view.GestureDetector;
        import android.view.MotionEvent;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebResourceRequest;
        import android.widget.FrameLayout; 
        import android.widget.RelativeLayout; 
        import android.widget.ProgressBar;
        import android.widget.Button;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

        import com.google.android.exoplayer2.DefaultLoadControl;
        import com.google.android.exoplayer2.ExoPlayer;
        import com.google.android.exoplayer2.MediaItem;
        import com.google.android.exoplayer2.Player;
        import com.google.android.exoplayer2.PlaybackException;
        import com.google.android.exoplayer2.ui.StyledPlayerView;

        public class MainActivity extends AppCompatActivity {
            private WebView wv;
            private ExoPlayer player;
            private StyledPlayerView playerView;
            private FrameLayout playerContainer; 
            private ProgressBar loadingSpinner;
            private SwipeRefreshLayout swipeRefresh;
            private boolean isFullscreen = false;
            
            private GestureDetector gestureDetector;
            private int currentCategoryIndex = 0;
            
            // لێرەدا دەتوانیت ناوەکان دەستکاری بکەیت یان زیادیان بکەیت
            private final String[] categoryNames = {
                "سەرەکی", "وەرزش", "هەواڵ", "ئاینی", "فیلم", 
                "زنجیرەکان", "منداڵان", "دۆکیۆمێنتاری", "میوزیک", "هەمەڕەنگ"
            };
            
            // لێرەدا دەتوانیت لینکەکان دەستکاری بکەیت یان زیادیان بکەیت
            private final String[] categoryUrls = {
                "https://rebaz92.github.io/REBAZ_TV/index.html",
                "https://rebaz92.github.io/REBAZ_TV/sports.html",
                "https://rebaz92.github.io/REBAZ_TV/news.html",
                "https://rebaz92.github.io/REBAZ_TV/religion.html",
                "https://rebaz92.github.io/REBAZ_TV/movies.html",
                "https://rebaz92.github.io/REBAZ_TV/series.html",
                "https://rebaz92.github.io/REBAZ_TV/kids.html",
                "https://rebaz92.github.io/REBAZ_TV/doc.html",
                "https://rebaz92.github.io/REBAZ_TV/music.html",
                "https://rebaz92.github.io/REBAZ_TV/others.html"
            };

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                playerView = findViewById(R.id.main_player_view);
                playerContainer = findViewById(R.id.player_container);
                wv = findViewById(R.id.main_web_view);
                loadingSpinner = findViewById(R.id.native_loading_spinner);
                swipeRefresh = findViewById(R.id.swipe_refresh);

                wv.setBackgroundColor(Color.TRANSPARENT);
                playerContainer.setVisibility(View.GONE);

                player = new ExoPlayer.Builder(this).build();
                playerView.setPlayer(player);

                View closeBtn = playerView.findViewById(R.id.custom_close_btn);
                if (closeBtn != null) closeBtn.setOnClickListener(v -> stopAndHidePlayer());
                playerView.setFullscreenButtonClickListener(isFullScreen -> toggleFullscreen(isFullScreen));

                Button exitBtn = findViewById(R.id.security_exit_btn);
                if (exitBtn != null) {
                    exitBtn.setOnClickListener(v -> { finishAffinity(); System.exit(0); });
                }

                swipeRefresh.setOnRefreshListener(() -> {
                    wv.clearCache(true);
                    wv.reload();
                });

                setupSwipeGesture();
                initWebViewAndLoad();
            }

            private void setupSwipeGesture() {
                gestureDetector = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                    private static final int SWIPE_THRESHOLD = 100;
                    private static final int SWIPE_VELOCITY_THRESHOLD = 100;

                    @Override
                    public boolean onFling(MotionEvent e1, MotionEvent e2, float velocityX, float velocityY) {
                        if (e1 == null || e2 == null) return false;
                        float diffY = e2.getY() - e1.getY();
                        float diffX = e2.getX() - e1.getX();
                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            if (Math.abs(diffX) > SWIPE_THRESHOLD && Math.abs(velocityX) > SWIPE_VELOCITY_THRESHOLD) {
                                if (diffX > 0) {
                                    changeCategory(-1); // ڕاست
                                } else {
                                    changeCategory(1); // چەپ
                                }
                                return true;
                            }
                        }
                        return false;
                    }
                });

                wv.setOnTouchListener((v, event) -> {
                    gestureDetector.onTouchEvent(event);
                    return false; 
                });
            }
            
            private void changeCategory(int direction) {
                currentCategoryIndex += direction;
                
                if (currentCategoryIndex < 0) {
                    currentCategoryIndex = categoryNames.length - 1;
                } else if (currentCategoryIndex >= categoryNames.length) {
                    currentCategoryIndex = 0;
                }
                
                Toast.makeText(MainActivity.this, "بەشی: " + categoryNames[currentCategoryIndex], Toast.LENGTH_SHORT).show();
                swipeRefresh.setRefreshing(true);
                wv.loadUrl(categoryUrls[currentCategoryIndex]);
            }

            private void initWebViewAndLoad() {
                WebSettings ws = wv.getSettings();
                ws.setJavaScriptEnabled(true); 
                ws.setDomStorageEnabled(true); 
                
                ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                wv.clearCache(true);
                
                wv.addJavascriptInterface(new Object() {
                    @JavascriptInterface
                    public void playInExo(final String url, final String name) {
                        runOnUiThread(() -> {
                            if (url != null && !url.isEmpty()) {
                                swipeRefresh.setEnabled(false); 
                                
                                int heightPx = (int) (240 * getResources().getDisplayMetrics().density);
                                RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, heightPx);
                                params.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                                playerContainer.setLayoutParams(params);
                                
                                playerContainer.setVisibility(View.VISIBLE);
                                playerView.setVisibility(View.VISIBLE);

                                MediaItem mediaItem = MediaItem.fromUri(Uri.parse(url));
                                player.setMediaItem(mediaItem);
                                player.prepare(); 
                                player.play();
                            }
                        });
                    }
                }, "AndroidBridge");

                wv.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                        if (swipeRefresh != null) {
                            swipeRefresh.setRefreshing(false);
                        }
                    }
                    @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) { return false; }
                });
                
                wv.setWebChromeClient(new WebChromeClient());
                wv.loadUrl(categoryUrls[currentCategoryIndex]); 
            }

            private void stopAndHidePlayer() {
                if (player != null) { player.stop(); player.clearMediaItems(); }
                if (playerContainer != null) playerContainer.setVisibility(View.GONE);
                playerView.setVisibility(View.GONE);
                swipeRefresh.setEnabled(true);

                if (isFullscreen) {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    isFullscreen = false;
                }
            }

            private void toggleFullscreen(boolean fullscreen) {
                isFullscreen = fullscreen;
                if (fullscreen) {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    swipeRefresh.setVisibility(View.GONE);
                    playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                } else {
                    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                    getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    swipeRefresh.setVisibility(View.VISIBLE);
                    int heightPx = (int) (240 * getResources().getDisplayMetrics().density);
                    RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, heightPx);
                    params.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                    playerContainer.setLayoutParams(params);
                }
            }

            @Override public void onBackPressed() {
                if (isFullscreen) stopAndHidePlayer();
                else if (playerView.getVisibility() == View.VISIBLE) stopAndHidePlayer();
                else super.onBackPressed();
            }
        }
        EOF
        
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build REBAZ TV APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Finished REBAZ TV APK
      uses: actions/upload-artifact@v4
      with:
        name: REBAZ-TV-APK
        path: app/build/outputs/apk/debug/app-debug.apk
