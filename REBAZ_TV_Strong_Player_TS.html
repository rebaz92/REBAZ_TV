<script>
let currentCategory = 'news';
let hlsInstance = null;
let tsPlayer = null;
let plyrPlayer = null;
let currentUrl = '';
let retryTimer = null;

/* =========================
   PLAYER INITIALIZATION
========================= */

window.addEventListener('load', () => {

    plyrPlayer = new Plyr('#videoPlayer', {
        controls: [
            'play-large',
            'play',
            'progress',
            'current-time',
            'mute',
            'volume',
            'settings',
            'pip',
            'fullscreen'
        ],
        settings: ['quality', 'speed'],
        autoplay: false,
        clickToPlay: true,
        hideControls: true,
        resetOnEnd: false
    });

    updateVisibility();
});


/* =========================
   STATUS
========================= */

function setStatus(text, show = true) {

    const el = document.getElementById('playerStatus');

    if (!el) return;

    el.textContent = text || '';

    el.style.display = show ? 'block' : 'none';

    if (show) {

        clearTimeout(window.statusTimer);

        window.statusTimer = setTimeout(() => {
            el.style.display = 'none';
        }, 4000);
    }
}


/* =========================
   DESTROY OLD PLAYER
========================= */

function destroyPlayers() {

    clearTimeout(retryTimer);

    if (hlsInstance) {

        try {
            hlsInstance.stopLoad();
            hlsInstance.detachMedia();
            hlsInstance.destroy();
        } catch (e) {}

        hlsInstance = null;
    }

    if (tsPlayer) {

        try {
            tsPlayer.pause();
            tsPlayer.unload();
            tsPlayer.detachMediaElement();
            tsPlayer.destroy();
        } catch (e) {}

        tsPlayer = null;
    }

    const video = document.getElementById('videoPlayer');

    if (video) {

        try {
            video.pause();
            video.removeAttribute('src');
            video.removeAttribute('type');
            video.load();
        } catch (e) {}
    }
}


/* =========================
   NATIVE PLAYER
========================= */

function playNative(url) {

    const video = document.getElementById('videoPlayer');

    if (!video) return;

    try {

        video.src = url;

        video.load();

        const promise = video.play();

        if (promise) {
            promise.catch(() => {});
        }

    } catch (e) {

        setStatus('ئەم لینکە ناتوانرێت پەخش بکرێت');
    }
}


/* =========================
   HLS PLAYER
========================= */

function playHLS(url) {

    const video = document.getElementById('videoPlayer');

    if (!video) return;

    setStatus('HLS خەریکی بارکردنە...');

    /* HLS.js */

    if (window.Hls && Hls.isSupported()) {

        try {

            hlsInstance = new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 30,

                maxBufferLength: 20,

                maxMaxBufferLength: 40,

                liveSyncDurationCount: 3,

                liveMaxLatencyDurationCount: 6,

                manifestLoadingMaxRetry: 5,

                levelLoadingMaxRetry: 5,

                fragLoadingMaxRetry: 8,

                fragLoadingRetryDelay: 1000,

                manifestLoadingRetryDelay: 1000,

                levelLoadingRetryDelay: 1000,

                enableStashBuffer: true,

                stashInitialSize: 384 * 1024
            });


            hlsInstance.attachMedia(video);


            hlsInstance.on(
                Hls.Events.MEDIA_ATTACHED,
                () => {

                    hlsInstance.loadSource(url);
                }
            );


            hlsInstance.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    setStatus('پەخشکردن دەستی پێکرد', true);

                    const promise = video.play();

                    if (promise) {
                        promise.catch(() => {});
                    }
                }
            );


            hlsInstance.on(
                Hls.Events.ERROR,
                (event, data) => {

                    if (!data || !data.fatal) return;


                    if (
                        data.type === Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        setStatus('کێشەی Network ـە، دووبارە هەوڵ دەدرێتەوە...');

                        clearTimeout(retryTimer);

                        retryTimer = setTimeout(() => {

                            if (hlsInstance) {
                                try {
                                    hlsInstance.startLoad(-1);
                                } catch (e) {}
                            }

                        }, 1500);

                    }

                    else if (
                        data.type === Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        setStatus('چاککردنەوەی Media...');

                        try {
                            hlsInstance.recoverMediaError();
                        } catch (e) {}

                    }

                    else {

                        setStatus('HLS پەخش نەکرا');

                        try {
                            hlsInstance.destroy();
                        } catch (e) {}

                        hlsInstance = null;
                    }
                }
            );

        } catch (e) {

            setStatus('HLS Player هەڵەی تێدا هەیە');
        }

        return;
    }


    /* Safari / Native HLS */

    if (
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        playNative(url);

        return;
    }


    setStatus('HLS لەم دەستگەیە پشتگیری ناکرێت');
}


/* =========================
   MPEG-TS PLAYER
========================= */

function playTS(url) {

    const video = document.getElementById('videoPlayer');

    if (!video) return;

    setStatus('TS خەریکی بارکردنە...');


    if (
        window.mpegts &&
        typeof mpegts.isSupported === 'function' &&
        mpegts.isSupported()
    ) {

        try {

            tsPlayer = mpegts.createPlayer(

                {
                    type: 'mpegts',
                    isLive: true,
                    url: url
                },

                {

                    enableWorker: true,

                    lazyLoad: false,

                    enableStashBuffer: true,

                    stashInitialSize: 384 * 1024,

                    liveBufferLatencyChasing: true,

                    liveBufferLatencyMaxLatency: 10,

                    liveBufferLatencyMinRemain: 2,

                    autoCleanupSourceBuffer: true,

                    autoCleanupMaxBackwardDuration: 30,

                    autoCleanupMinBackwardDuration: 15
                }
            );


            tsPlayer.attachMediaElement(video);

            tsPlayer.load();


            tsPlayer.on(
                mpegts.Events.ERROR,
                (type, detail, info) => {

                    setStatus(
                        'کێشە لە پەخشی TS ـە'
                    );

                    console.log(
                        'MPEGTS ERROR:',
                        type,
                        detail,
                        info
                    );
                }
            );


            const promise = tsPlayer.play();

            if (promise) {
                promise.catch(() => {});
            }

        } catch (e) {

            console.log(e);

            setStatus(
                'TS Player نەتوانی لینکەکە بکاتەوە'
            );
        }

        return;
    }


    setStatus(
        'MPEG-TS لەم دەستگەیە پشتگیری ناکرێت'
    );
}


/* =========================
   AUTO DETECTION
========================= */

function playChannel(url, category, btnElement) {

    if (!url) {

        setStatus('لینک بەتاڵە');

        return;
    }


    currentUrl = url;


    const playerContainer =
        document.getElementById('playerContainer');

    const scrollableContent =
        document.getElementById('scrollableContent');

    const watermark =
        document.getElementById('watermarkLogo');


    /* Active channel */

    document
        .querySelectorAll('.card')
        .forEach(card => {

            card.classList.remove(
                'active-channel'
            );
        });


    const selected =
        btnElement
        ? btnElement.closest('.card')
        : null;


    if (selected) {

        selected.classList.add(
            'active-channel'
        );
    }


    /* Show player */

    playerContainer.style.display = 'flex';

    scrollableContent.style.top = '430px';

    watermark.style.display =
        category === 'sport'
        ? 'block'
        : 'none';


    destroyPlayers();


    const lower =
        url.toLowerCase().trim();


    /*
      HLS
    */

    if (
        lower.includes('.m3u8') ||
        lower.includes('m3u8')
    ) {

        playHLS(url);

        return;
    }


    /*
      MPEG-TS
    */

    if (
        lower.includes('.ts') ||
        lower.includes('mpegts') ||
        lower.includes('mpeg-ts') ||
        lower.includes('video/mp2t')
    ) {

        playTS(url);

        return;
    }


    /*
      MP4
    */

    if (
        lower.match(
            /\.(mp4)(\?|#|$)/
        )
    ) {

        playNative(url);

        return;
    }


    /*
      WEBM
    */

    if (
        lower.match(
            /\.(webm)(\?|#|$)/
        )
    ) {

        playNative(url);

        return;
    }


    /*
      OGG
    */

    if (
        lower.match(
            /\.(ogg|ogv)(\?|#|$)/
        )
    ) {

        playNative(url);

        return;
    }


    /*
      Unknown HTTP / HTTPS

      First try native.
    */

    playNative(url);
}


/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen() {

    const container =
        document.getElementById(
            'playerContainer'
        );

    if (!container) return;


    if (
        document.fullscreenElement ||
        document.webkitFullscreenElement
    ) {

        if (document.exitFullscreen) {

            document.exitFullscreen();

        } else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();
        }

        return;
    }


    if (container.requestFullscreen) {

        container.requestFullscreen();

    } else if (
        container.webkitRequestFullscreen
    ) {

        container.webkitRequestFullscreen();
    }

    else {

        const video =
            document.getElementById(
                'videoPlayer'
            );

        if (
            video &&
            video.webkitEnterFullscreen
        ) {

            video.webkitEnterFullscreen();
        }
    }
}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category, btn) {

    currentCategory = category;


    document
        .querySelectorAll('.cat-btn')
        .forEach(button => {

            button.classList.remove(
                'active'
            );
        });


    btn.classList.add('active');


    document.getElementById(
        'searchInput'
    ).value = '';


    updateVisibility();
}
