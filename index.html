<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        /* CSS هەمان شێوەی پێشوو */
        body { background-color: #121212; color: #fff; font-family: Tahoma, sans-serif; margin: 0; overflow: hidden; }
        .fullscreen-mode .fixed-top-section, .fullscreen-mode .categories-container { display: none !important; }
        .fullscreen-mode .player-container { height: 100vh !important; margin: 0 !important; border-radius: 0 !important; }
        .fixed-top-section { position: fixed; top: 0; right: 0; left: 0; background: #121212; z-index: 1000; padding: 10px; }
        .player-container { position: relative; width: 100%; height: 200px; background: #000; display: none; margin-bottom: 10px; }
        .player-container video { width: 100%; height: 100%; }
        .categories-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .cat-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid #d4af37; background: #1a2a3a; color: white; cursor: pointer; }
        .cat-btn.active { background: #0044cc; }
        .scrollable-content { position: absolute; top: 320px; bottom: 0; right: 0; left: 0; overflow-y: auto; padding: 10px; }
        .card { background: #1a2a3a; margin-bottom: 15px; padding: 10px; border-radius: 15px; border: 1px solid #d4af37; }
        .card h3 { margin: 0; font-size: 16px; color: #ffcc00; }
        .play-link-btn { background: red; color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="fixed-top-section">
    <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ..." onkeyup="searchChannels()" style="width: 100%; padding: 10px; border-radius: 10px;">
    
    <div class="player-container" id="playerContainer" onclick="toggleOverlay()">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="categories-container" id="categoriesBar">
        <button class="cat-btn active" onclick="filterCategory('news', this)">هەواڵ</button>
        <button class="cat-btn" onclick="filterCategory('sport', this)">وەرزش</button>
        <button class="cat-btn" onclick="filterCategory('kurdish', this)">کوردی</button>
    </div>
</div>

<div class="scrollable-content" id="scrollableContent">
    <div class="channels-container" id="channelsList">
        
        <!-- لێرە هەموو کەناڵەکانت دابنێ -->
        <div class="card" data-category="news" data-name="rudaw tv">
            <h3>RUDAW TV</h3>
            <a href="#" onclick="playChannel('https://live.rudaw.net/hls/rudaw-tv/master.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
        </div>

        <div class="card" data-category="news" data-name="kurdistan 24">
            <h3>KURDISTAN 24</h3>
            <a href="#" onclick="playChannel('https://k24-origin.akamaized.net/hls/live/2000000/k24/master.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
        </div>

        <div class="card" data-category="sport" data-name="kurdish sport">
            <h3>KURDISH SPORT</h3>
            <a href="#" onclick="playChannel('لینکەکەت_لێرە_دابنێ', 'sport', this); return false;" class="play-link-btn">پەخش</a>
        </div>

        <!-- دەتوانیت کەناڵەکانی تر بەم شێوەیە زیاد بکەیت -->

    </div>
</div>

<script>
    let currentCategory = 'news';

    function toggleOverlay() { document.body.classList.toggle('fullscreen-mode'); }

    function playChannel(url, category, btnElement) {
        var playerContainer = document.getElementById('playerContainer');
        var video = document.getElementById('videoPlayer');
        playerContainer.style.display = 'flex';
        
        if (window.hlsInstance) window.hlsInstance.destroy();
        
        if (Hls.isSupported()) {
            var hls = new Hls();
            window.hlsInstance = hls;
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        }
    }

    function filterCategory(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.card').forEach(card => {
            card.style.display = (card.getAttribute('data-category') === category) ? 'block' : 'none';
        });
    }

    function searchChannels() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            let name = card.getAttribute('data-name').toLowerCase();
            let cat = card.getAttribute('data-category');
            card.style.display = (name.includes(query) && cat === currentCategory) ? 'block' : 'none';
        });
    }
    
    // کاراکردنی فیلتەر لە یەکەمجاردا
    filterCategory('news', document.querySelector('.cat-btn'));
</script>

</body>
</html>
