<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <!-- FontAwesome for Player Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js for IPTV Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #fff;
            overflow: hidden;
        }

        /* Main Player Container */
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Overlay UI Container */
        .controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 1;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 15px 20px;
        }

        .controls-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* 1. TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .channel-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
        }

        .channel-logo-top {
            width: 45px;
            height: 45px;
            background: #fff;
            border-radius: 10px;
            padding: 4px;
            object-fit: contain;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .channel-title-top {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .server-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 12px;
        }

        .btn-server {
            background: rgba(255, 255, 255, 0.15);
            color: #ccc;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-server.active {
            background: #ff3b30;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.5);
        }

        /* 2. CENTER CONTROLS */
        .center-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .btn-control:active {
            transform: scale(0.9);
        }

        .btn-control.play-pause {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.3);
            font-size: 24px;
        }

        /* 3. BOTTOM CHANNEL BAR */
        .bottom-bar {
            width: 100%;
            padding-top: 10px;
        }

        .channel-horizontal-list {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow-x: auto;
            padding: 10px 5px;
            scroll-behavior: smooth;
        }

        .channel-horizontal-list::-webkit-scrollbar {
            display: none;
        }

        .channel-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .channel-card:active {
            transform: scale(0.95);
        }

        .card-logo-wrapper {
            width: 95px;
            height: 55px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .card-logo-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-card span {
            font-size: 11px;
            font-weight: 600;
            color: #b0b0b0;
            text-align: center;
            max-width: 95px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Active Channel Red Glow Border */
        .channel-card.active .card-logo-wrapper {
            border-color: #ff3b30;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.8);
        }

        .channel-card.active span {
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- Video Element -->
        <video id="mainPlayer" autoplay playsinline></video>

        <!-- Fullscreen Controls Overlay -->
        <div class="controls-overlay" id="controlsOverlay">
            
            <!-- Top Section -->
            <div class="top-bar">
                <div class="channel-info-group">
                    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-chevron-right"></i></button>
                    <img id="currentLogo" class="channel-logo-top" src="" alt="Logo">
                    <div id="currentTitle" class="channel-title-top">BEIN SPORTS 1</div>
                </div>

                <div class="server-switcher">
                    <button class="btn-server active" onclick="switchServer(1, this)">سێرفەری ١</button>
                    <button class="btn-server" onclick="switchServer(2, this)">سێرفەری ٢</button>
                </div>
            </div>

            <!-- Center Controls Section -->
            <div class="center-controls">
                <button class="btn-control" onclick="rewind(10)"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-control" onclick="toggleMute()"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></button>
                <button class="btn-control"><i class="fa-solid fa-gear"></i></button>
                <button class="btn-control play-pause" onclick="togglePlay()"><i class="fa-solid fa-pause" id="playIcon"></i></button>
                <button class="btn-control"><i class="fa-solid fa-icons"></i></button>
                <button class="btn-control" onclick="togglePiP()"><i class="fa-solid fa-clone"></i></button>
                <button class="btn-control" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                <button class="btn-control" onclick="forward(10)"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <!-- Bottom Horizontal Channels List -->
            <div class="bottom-bar">
                <div class="channel-horizontal-list" id="channelListContainer">
                    <!-- Channels populated dynamically via JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Sample Channel Playlist Data
        const channelsData = [
            { id: 1, name: "BEIN SPORTS 1", logo: "https://upload.wikimedia.org/wikipedia/commons/3/3d/BeIN_Sports_1_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 2, name: "BEIN SPORTS 2", logo: "https://upload.wikimedia.org/wikipedia/commons/a/a2/BeIN_Sports_2_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 3, name: "BEIN SPORTS 3", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e4/BeIN_Sports_3_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 4, name: "BEIN SPORTS 4", logo: "https://upload.wikimedia.org/wikipedia/commons/5/52/BeIN_Sports_4_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 5, name: "BEIN SPORTS 5", logo: "https://upload.wikimedia.org/wikipedia/commons/a/a7/BeIN_Sports_5_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 6, name: "BEIN SPORTS 6", logo: "https://upload.wikimedia.org/wikipedia/commons/a/a3/BeIN_Sports_6_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { id: 7, name: "BEIN SPORTS 7", logo: "https://upload.wikimedia.org/wikipedia/commons/2/2a/BeIN_Sports_7_logo.png", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ];

        const video = document.getElementById('mainPlayer');
        const overlay = document.getElementById('controlsOverlay');
        const playerContainer = document.getElementById('playerContainer');
        const channelListContainer = document.getElementById('channelListContainer');
        const currentTitle = document.getElementById('currentTitle');
        const currentLogo = document.getElementById('currentLogo');
        const playIcon = document.getElementById('playIcon');
        const volumeIcon = document.getElementById('volumeIcon');

        let hls = new Hls();
        let hideTimeout;
        let activeChannelId = 1;

        // Load Channel Stream
        function playChannel(channel) {
            activeChannelId = channel.id;
            currentTitle.textContent = channel.name;
            currentLogo.src = channel.logo;

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.play();
            }

            renderChannels();
            resetHideTimer();
        }

        // Render Bottom Horizontal Channel Bar
        function renderChannels() {
            channelListContainer.innerHTML = '';
            channelsData.forEach(ch => {
                const card = document.createElement('div');
                card.className = `channel-card ${ch.id === activeChannelId ? 'active' : ''}`;
                card.onclick = (e) => {
                    e.stopPropagation();
                    playChannel(ch);
                };

                card.innerHTML = `
                    <div class="card-logo-wrapper">
                        <img src="${ch.logo}" alt="${ch.name}">
                    </div>
                    <span>${ch.name}</span>
                `;
                channelListContainer.appendChild(card);
            });
        }

        // Toggle Controls Visibility on Tap
        function resetHideTimer() {
            overlay.classList.remove('hide');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                overlay.classList.add('hide');
            }, 4000);
        }

        playerContainer.addEventListener('click', () => {
            if (overlay.classList.contains('hide')) {
                resetHideTimer();
            } else {
                overlay.classList.add('hide');
            }
        });

        // Controls Logic
        function togglePlay() {
            if (video.paused) {
                video.play();
                playIcon.className = 'fa-solid fa-pause';
            } else {
                video.pause();
                playIcon.className = 'fa-solid fa-play';
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            volumeIcon.className = video.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        }

        function rewind(seconds) {
            video.currentTime -= seconds;
        }

        function forward(seconds) {
            video.currentTime += seconds;
        }

        function switchServer(serverNum, btn) {
            document.querySelectorAll('.btn-server').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        }

        async function togglePiP() {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled) {
                await video.requestPictureInPicture();
            }
        }

        // Initialize First Channel
        renderChannels();
        playChannel(channelsData[0]);
        resetHideTimer();
    </script>
</body>
</html>
