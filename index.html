<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />    
    <meta http-equiv="Expires" content="0" />

    <title>REBAZ TV</title>
    <!-- کتێبخانەکانی HLS و MPEG-TS بۆ کارپێکردنی هەموو جۆرە لینکەکان -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        body {
            background-image: url('https://i.pinimg.com/236x/3a/91/0f/3a910f5a86e47610668ad580e0401715.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* بەشی سەرەوەی جێگیر */
        .fixed-top-section {
            background-color: transparent;
            z-index: 1000;
            padding: 8px 10px 0 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .search-box {
            background-color: #1e1e1e;
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
            text-align: right;
            font-family: Tahoma, sans-serif;
        }

        .vip-card {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d131a 100%);
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 8px;
        }
        .vip-card h2 {
            color: #ffcc00;
            margin: 0 0 4px 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8);
        }
        .vip-card p {
            color: #ccc;
            margin: 0;
            font-size: 13px;
            font-weight: bold;
        }

        /* چوارگۆچە و جێگیرکردنی نوسینەکە بێ جووڵە */
        .ticker-wrapper {
            width: 85%;
            max-width: 280px;
            margin: 6px auto;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 4px 10px;
            background-color: rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .ticker-text {
            display: inline-block;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
        }

        /* شاشەی پەخشی وێب */
        .player-container {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            display: none; 
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* لۆگۆی سەر شاشە بە قەبارەی بچووک و پشتینەی سەوز */
        .watermark-logo {
            position: absolute;
            top: 6px;
            right: 10px;
            background-color: #008000;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 1px solid #d4af37;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        .player-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .categories-container::-webkit-scrollbar {
            display: none;
        }
        
        .cat-btn {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d131a 100%);
            color: #ffffff;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .cat-btn.active {
            background-color: #0044cc;
            border-color: #0066ff;
            box-shadow: 0 4px 10px rgba(0,102,255,0.4);
        }
        
        /* لیستی کەناڵەکان */
        .scrollable-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: none;
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .channels-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 400px;
            margin: 0 auto;
            padding-bottom: 30px;
        }
        
        .section-title-alwan, .section-title-bein, .section-title-kurdish-sports {
            display: inline-block;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            margin: 12px 5px 6px 5px;
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .section-title-alwan { border: 1px solid #00ff66; background: rgba(0, 255, 102, 0.15); }
        .section-title-bein { border: 1px solid #b800e6; background: rgba(184, 0, 230, 0.15); }
        .section-title-kurdish-sports { border: 1px solid #ff7700; background: rgba(255, 119, 0, 0.15); }

        .card {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d131a 100%);
            border: 1px solid #d4af37;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        @keyframes softRedGlow {
            0% { border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
            50% { border-color: #ff8080; box-shadow: 0 0 16px rgba(255, 51, 51, 0.8); }
            100% { border-color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
        }

        .card.active-channel {
            animation: softRedGlow 2s infinite ease-in-out;
            border: 2px solid #ff3333;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
        }
        .channel-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        
        .cat-tag {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .card[data-category="news"] .cat-tag { color: #ff3333; }
        .card[data-category="sport"] .cat-tag { color: #00cc44; }
        .card[data-category="kurdish"] .cat-tag { color: #b800e6; }
        .card[data-category="documentary"] .cat-tag { color: #b800e6; }
        .card[data-category="kids"] .cat-tag { color: #ff9900; }
        .card[data-category="islamic"] .cat-tag { color: #00ffff; }

        .card-header img {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
            background: #000;
            border: 1px solid #d4af37;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .card-header h3 {
            margin: 0;
            font-size: 18px;
            color: #ffcc00;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        
        .play-link-btn {
            background: linear-gradient(135deg, #cc0000 0%, #660000 100%);
            color: #ffffff;
            border: 1px solid #ff1a1a;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* 📱 دیزاینی تایبەت بۆ شاشەی پان (Android TV) */
        @media (orientation: landscape) and (min-width: 600px) {
            body { flex-direction: row; }
            .fixed-top-section { width: 25%; max-width: none; border-left: 1px solid #333; }
            .scrollable-content { width: 35%; border-left: 1px solid #333; }
            .player-container { width: 40%; height: 100vh; margin: 0; border-radius: 0; display: flex !important; }
            .channels-container { max-width: none; }
        }
    </style>
</head>
<body>

<div class="fixed-top-section">
    <div class="search-box" id="searchBoxContainer">
        <span style="color: #aaa; margin-left: 10px; font-size: 18px;">🔍</span>
        <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ..." onkeyup="searchChannels()">
    </div>

    <div class="vip-card" id="vipCardContainer">
        <h2>REBAZ TV</h2>
        <div class="ticker-wrapper">
            <span class="ticker-text">اللّهُمَّ صَلِّ عَلَىٰ مُحَمَّد وَعَلَىٰ آلِ مُحَمَّد</span>
        </div>
    </div>

    <!-- شاشەی پەخشی HTML کاتێک لە وێبدا ئیش دەکات -->
    <div class="player-container" id="playerContainer">
        <div id="watermarkLogo" class="watermark-logo">REBAZ | TV</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="categories-container" id="categoriesBar">
        <button class="cat-btn active" onclick="filterCategory('news', this)">هەواڵ</button>
        <button class="cat-btn" onclick="filterCategory('kurdish', this)">کوردی ناوخۆیی</button>
        <button class="cat-btn" onclick="filterCategory('sport', this)">وەرزش</button>
        <button class="cat-btn" onclick="filterCategory('documentary', this)">دۆکومێنتاری</button>
        <button class="cat-btn" onclick="filterCategory('kids', this)">منداڵان</button>
        <button class="cat-btn" onclick="filterCategory('islamic', this)">ئاینی</button>
    </div>
</div>

<div class="scrollable-content" id="scrollableContent">
    <div class="channels-container" id="channelsList">
        <!-- کەناڵەکان وەک خۆیان ماونەتەوە -->
        <div class="card" data-category="news" data-name="rudaw tv ڕووداو">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">NEWS</span>
                        <img src="https://photos.smugmug.com/Rudaw-logo/i-7WVWZvk/0/KpP92MzbzGV2SX3ftc2J6RdbjN27V7GGc6hhgG2FZ/L/unnamed-L.png" alt="Rudaw">
                    </div>
                    <h3>RUDAW TV</h3>
                </div>
                <a href="#" onclick="playChannel('https://live.rudaw.net/hls/rudaw-tv/master.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>

        <!-- کەناڵی هەواڵ ئاڤا -->
        <div class="card" data-category="news" data-name="ئاڤا نیوز ava news">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">NEWS</span>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/AVAMedialogo.jpg/1280px-AVAMedialogo.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="Logo">
                    </div>
                    <h3>AVA TV</h3>
                </div>
                <a href="#" onclick="playChannel('http://hlspackager.akamaized.net/live/DB/AVA_TV/HLS/AVA_TV.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>

        <!-- کەناڵی هەواڵ / ئێن ئاڕتی نیوز -->
        <div class="card" data-category="news" data-name="ئێن ئاڕتی نیوز nrt news">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">NEWS</span>
                        <img src="https://cdn.aptoide.com/imgs/6/5/8/658804c9f585867dcbf51564c2f2c52c_icon.png" alt="Logo">
                    </div>
                    <h3>NRT News</h3>
                </div>
                <a href="#" onclick="playChannel('https://live20.bozztv.com/giatv/giatv-nrt/nrt/chunks.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>

        <!-- کەناڵی هەواڵ / کوردستان 24 -->
        <div class="card" data-category="news" data-name="کوردستان 24 k24 news">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">NEWS</span>
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEHOcbPunNqhyTNTZNt51da4UL86_S1X5_zA&s" alt="Logo">
                    </div>
                    <h3>K24 News</h3>
                </div>
                <a href="#" onclick="playChannel('https://d1x82nydcxndze.cloudfront.net/live/index.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>

        <!-- کەناڵی هەواڵ / کەناڵ 8 -->
        <div class="card" data-category="news" data-name="کەناڵ 8 channel 8">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">NEWS</span>
                        <img src="https://play-lh.googleusercontent.com/L2ti94G0LEg0-46J8Q-HO28H0Pge0W5O1tuaKGj2qhcrHf7U230UsCKsKTChpYZvMIDhZ-1PPEN0D2tcfgo5RQ" alt="Logo">
                    </div>
                    <h3>Channel 8</h3>
                </div>
                <a href="#" onclick="playChannel('https://live.channel8.com/Channel8-Kurdish/index.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>
        
        <!-- کەناڵی کوردی ناوخۆیی / واڵا تیڤی -->
        <div class="card" data-category="kurdish" data-name="واڵا تیڤی wala tv">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">kurdish local</span>
                        <img src="https://imglink.cc/cdn/EAsqpKxkHG.png" alt="Wala TV">
                    </div>
                    <h3>Wala TV Chamchamal</h3>
                </div>
                <a href="#" onclick="playChannel('https://cdn.karwan.tv/wallatv/index.m3u8', 'kurdish', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>

        <!-- کەناڵی وەرزشی / ئەلوان سپۆرت 1 -->
        <div class="card" data-category="sport" data-name="ئەلوان سپۆرت alwan sport">
            <div class="card-header">
                <div class="channel-info">
                    <div class="logo-wrapper">
                        <span class="cat-tag">SPORT</span>
                        <img src="https://www.newsroom.info/Upload/libfiles/55/4/385.jpeg" alt="Alwan Sport">
                    </div>
                    <h3>Alwan Sport 1 4K</h3>
                </div>
                <a href="#" onclick="playChannel('http://xlion.net:8080/15034094901029/18800196589372/418111', 'sport', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>
        
        <!-- کەناڵەکانی تر وەک خۆیان بەردەوام بن -->
    </div>
</div>

<script>
    let currentCategory = 'news';

    window.onload = function() {
        updateVisibility();
    };

    function updateVisibility() {
        document.querySelectorAll('.card, .section-title-alwan, .section-title-bein, .section-title-kurdish-sports').forEach(item => {
            if (item.getAttribute('data-category') === currentCategory) {
                item.style.display = item.classList.contains('section-title-alwan') || item.classList.contains('section-title-bein') || item.classList.contains('section-title-kurdish-sports') ? 'inline-block' : 'block';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function playChannel(url, category, btnElement) {
        var playerContainer = document.getElementById('playerContainer');
        var video = document.getElementById('videoPlayer');
        var watermarkLogo = document.getElementById('watermarkLogo');

        document.querySelectorAll('.card').forEach(card => card.classList.remove('active-channel'));
        let selectedCard = btnElement ? btnElement.closest('.card') : null;
        if (selectedCard) selectedCard.classList.add('active-channel');

        let channelName = selectedCard ? (selectedCard.querySelector('h3') ? selectedCard.querySelector('h3').innerText : 'REBAZ TV') : 'REBAZ TV';

        if (typeof AndroidBridge !== 'undefined' && AndroidBridge.playInExo) {
            AndroidBridge.playInExo(url, channelName);
            return;
        }

        playerContainer.style.display = 'flex';

        if (category === 'sport') {
            watermarkLogo.style.display = 'block';
        } else {
            watermarkLogo.style.display = 'none';
        }

        if (window.hlsInstance) { window.hlsInstance.destroy(); window.hlsInstance = null; }
        if (window.mpegtsPlayer) { window.mpegtsPlayer.destroy(); window.mpegtsPlayer = null; }

        if (url.includes('.ts') && typeof mpegts !== 'undefined' && mpegts.isSupported()) {
            var mpegtsPlayer = mpegts.createPlayer({ type: 'mse', isLive: true, url: url });
            window.mpegtsPlayer = mpegtsPlayer;
            mpegtsPlayer.attachMediaElement(video);
            mpegtsPlayer.load();
            mpegtsPlayer.play().catch(e => console.log(e));
        } 
        else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            var hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3, lowLatencyMode: true });
            window.hlsInstance = hls;
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        } else if (video && video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', function() { video.play(); });
        }
    }

    function filterCategory(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('searchInput').value = '';
        updateVisibility();
    }

    function searchChannels() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            let channelName = card.getAttribute('data-name').toLowerCase();
            let cardCat = card.getAttribute('data-category');
            card.style.display = (channelName.includes(query) && cardCat === currentCategory) ? 'block' : 'none';
        });
        document.querySelectorAll('.section-title-alwan, .section-title-bein, .section-title-kurdish-sports').forEach(title => {
            title.style.display = query ? 'none' : (title.getAttribute('data-category') === currentCategory ? 'inline-block' : 'none');
        });
    }
</script>

</body>
</html>
