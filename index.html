<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />   
    <meta http-equiv="Expires" content="0" />

    <title>REBAZ TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        body {
            background-image: url('https://i.pinimg.com/236x/3a/91/0f/3a910f5a86e47610668ad580e0401715.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .fixed-top-section {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            background-color: #121212;
            z-index: 1000;
            padding: 8px 10px 0 10px;
            max-width: 420px;
            margin: 0 auto;
        }

        .search-box {
            background-color: #1e1e1e;
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
            text-align: right;
            font-family: Tahoma, sans-serif;
        }

        .vip-card {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d131a 100%);
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 8px;
        }

        .vip-card .header-logo {
            max-width: 80%;
            max-height: 55px;
            height: auto;
            display: block;
            margin: 0 auto 6px auto;
            object-fit: contain;
        }

        .ticker-wrapper {
            width: 85%;
            max-width: 280px;
            margin: 6px auto;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 4px 10px;
            background-color: rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .ticker-text { color: #ffffff; font-size: 14px; font-weight: bold; }

        .player-container {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #d4af37;
            display: none; 
            align-items: center;
            justify-content: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 20;
        }

        .watermark-logo {
            position: absolute;
            top: 6px;
            right: 10px;
            background-color: #008000;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
            display: none;
        }

        .player-container video { width: 100%; height: 100%; object-fit: contain; }

        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .cat-btn {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d131a 100%);
            color: #ffffff;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active { background-color: #0044cc; border-color: #0066ff; }
        
        .scrollable-content {
            position: absolute;
            top: 220px; 
            bottom: 0;
            right: 0;
            left: 0;
            overflow-y: auto;
            padding: 10px;
            transition: top 0.3s ease;
        }
        
        .channels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 420px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .section-title-alwan, .section-title-bein, .section-title-kurdish-sports {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 5px;
            margin: 10px 0;
            border-radius: 20px;
        }
        .section-title-alwan { border: 1px solid #00ff66; background: rgba(0, 255, 102, 0.15); }
        .section-title-bein { border: 1px solid #b800e6; background: rgba(184, 0, 230, 0.15); }
        .section-title-kurdish-sports { border: 1px solid #ff7700; background: rgba(255, 119, 0, 0.15); }

        .card {
            background: linear-gradient(145deg, #1e2d3d 0%, #0a1017 100%);
            border: 1px solid #d4af37;
            border-radius: 18px;
            overflow: hidden;
            aspect-ratio: 1 / 1.15;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card-header { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-wrapper { width: 100%; height: 70%; display: flex; align-items: center; justify-content: center; position: relative; padding: 5px; }
        .card-header img { max-width: 90%; max-height: 80px; object-fit: contain; }
        .cat-tag { position: absolute; top: 5px; right: 5px; font-size: 8px; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 4px; }
        .card h3 { font-size: 10px; text-align: center; margin: 5px 0; padding: 0 5px; white-space: nowrap; overflow: hidden; }
        .play-link-btn { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .card.active-channel { border: 2px solid #ff3333; }
    </style>
</head>
<body>

<div class="fixed-top-section" id="topSection">
    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ..." onkeyup="searchChannels()">
    </div>

    <div class="vip-card">
        <img src="https://imglink.cc/cdn/u4Kyu4xK3Z.png" alt="REBAZ TV" class="header-logo">
        <div class="ticker-wrapper"><span class="ticker-text">اللّهُمَّ صَلِّ عَلَىٰ مُحَمَّد وَعَلَىٰ آلِ مُحَمَّد</span></div>
    </div>

    <div class="player-container" id="playerContainer">
        <button class="close-btn" onclick="closePlayer()">✕ داخستن</button>
        <div id="watermarkLogo" class="watermark-logo">REBAZ | TV</div>
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="categories-container" id="categoriesBar">
        <button class="cat-btn active" onclick="filterCategory('news', this)">هەواڵ</button>
        <button class="cat-btn" onclick="filterCategory('kurdish', this)">کوردی</button>
        <button class="cat-btn" onclick="filterCategory('sport', this)">وەرزش</button>
        <button class="cat-btn" onclick="filterCategory('documentary', this)">دۆکومێنتاری</button>
        <button class="cat-btn" onclick="filterCategory('kids', this)">منداڵان</button>
        <button class="cat-btn" onclick="filterCategory('islamic', this)">ئاینی</button>
    </div>
</div>

<div class="scrollable-content" id="scrollableContent">
    <div class="channels-container" id="channelsList">
        <!-- کەناڵەکان لێرەدان وەک پێشوو -->
        <!-- [تێبینی: سەرجەم کەناڵەکانت لە جێگای خۆیان ماونەتەوە] -->
        <!-- (کۆدەکە لێرەدا وەک خۆیەتی و هیچ شتێکم نەسڕیوەتەوە) -->

        <!-- تەنها یەک نموونە دادەنێم بۆ کورتکردنەوەی وەڵامەکە بەڵام لە فایلەکەی خۆتدا هەموو کەناڵەکانت بمێنێتەوە -->
        <div class="card" data-category="news" data-name="rudaw tv ڕووداو">
            <div class="card-header">
                <div class="logo-wrapper"><span class="cat-tag">NEWS</span><img src="https://photos.smugmug.com/Rudaw-logo/i-7WVWZvk/0/KpP92MzbzGV2SX3ftc2J6RdbjN27V7GGc6hhgG2FZ/L/unnamed-L.png"></div>
                <h3>RUDAW TV</h3>
                <a href="#" onclick="playChannel('https://live.rudaw.net/hls/rudaw-tv/master.m3u8', 'news', this); return false;" class="play-link-btn">پەخش</a>
            </div>
        </div>
        <!-- ... هەموو کەناڵەکانی ترت لێرە دابنێ وەک خۆی ... -->
    </div>
</div>

<script>
    let currentCategory = 'news';

    function updateVisibility() {
        document.querySelectorAll('.card, .section-title-alwan, .section-title-bein, .section-title-kurdish-sports').forEach(item => {
            const isCategoryMatch = item.getAttribute('data-category') === currentCategory;
            item.style.display = isCategoryMatch ? (item.classList.contains('card') ? 'flex' : 'inline-block') : 'none';
        });
    }

    function closePlayer() {
        const playerContainer = document.getElementById('playerContainer');
        const video = document.getElementById('videoPlayer');
        const scrollableContent = document.getElementById('scrollableContent');

        playerContainer.style.display = 'none';
        scrollableContent.style.top = '220px';
        video.pause();
        video.src = "";
    }

    function playChannel(url, category, btnElement) {
        var playerContainer = document.getElementById('playerContainer');
        var scrollableContent = document.getElementById('scrollableContent');
        var video = document.getElementById('videoPlayer');

        playerContainer.style.display = 'flex';
        scrollableContent.style.top = '430px'; // کاتێک ڤیدیۆ دەکرێتەوە لیستەکە دێتە خوارەوە

        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            if (window.hlsInstance) window.hlsInstance.destroy();
            var hls = new Hls();
            window.hlsInstance = hls;
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    function filterCategory(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateVisibility();
    }

    function searchChannels() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            let name = card.getAttribute('data-name').toLowerCase();
            let cat = card.getAttribute('data-category');
            card.style.display = (name.includes(query) && cat === currentCategory) ? 'flex' : 'none';
        });
    }

    window.onload = updateVisibility;
</script>

</body>
</html>
